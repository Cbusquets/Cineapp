name: cineapp
description: "Buscador de películas con TMDB API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Navegación
  go_router: ^14.0.0

  # Estado (BLoC)
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # HTTP / API
  dio: ^5.4.0

  # BD local
  hive_flutter: ^1.1.0

  # Preferencias
  shared_preferences: ^2.2.3

  # Imágenes
  cached_network_image: ^3.3.1

  # Variables de entorno
  flutter_dotenv: ^5.1.0

  # Trailer
  url_launcher: ^6.2.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generador de código para Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env